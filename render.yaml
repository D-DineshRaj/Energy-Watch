services:
  - type: web
    name: energywatch-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: CORS_ORIGINS
        value: https://energywatch.vercel.app
      # ENERGYWATCH_CURRENT_DATE removed — backend now uses the real system date.
      # Historical simulated data (Sep–Oct 2026) is correctly labelled as historical.

