services:
  - type: web
    name: energywatch-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://energywatch.vercel.app
      - key: ENERGYWATCH_CURRENT_DATE
        value: "2026-10-31"

